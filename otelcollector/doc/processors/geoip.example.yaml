# geoip processor — looks up IP addresses in a MaxMind database and adds geo attributes
# (geo.country.iso_code, geo.city.name, geo.location.lat/lon, ...).
#
# Scenario: the front-end/web tier sends spans and logs carrying the end user's IP in
# client.address. Adding geo data lets Kibana show maps and per-country breakdowns.
#
# Database: download GeoLite2-City.mmdb from MaxMind (free account) and mount it, e.g. via a
# Kubernetes volume at /etc/otel/geoip/. The file must exist when the collector starts.
#
# Run:  ./otelcol --config doc/processors/geoip.example.yaml
# Env:  ELASTICSEARCH_ENDPOINT, ELASTICSEARCH_API_KEY, GEOIP_DATABASE (path to .mmdb)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  geoip:
    context: record          # read the IP from span/log attributes (not the resource)
    attributes: [client.address, source.address]
    providers:
      maxmind:
        database_path: ${env:GEOIP_DATABASE}

  batch: {}

exporters:
  elasticsearch:
    endpoint: ${env:ELASTICSEARCH_ENDPOINT}
    api_key: ${env:ELASTICSEARCH_API_KEY}
    mapping:
      mode: otel

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, geoip, batch]
      exporters: [elasticsearch]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, geoip, batch]
      exporters: [elasticsearch]
