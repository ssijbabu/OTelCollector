# k8s_attributes processor — looks up the Kubernetes pod that sent the data and adds pod,
# namespace, workload and node metadata, plus selected labels and annotations.
#
# Scenario: agent DaemonSet receiving OTLP from pods on its node. Every signal should carry
# namespace, deployment, pod and node names and the app/team labels, so data can be
# filtered by workload in Kibana.
#
# Kubernetes:
#   - ClusterRole: get/watch/list on pods, namespaces, nodes; replicasets (apps) for
#     deployment names
#   - filter.node_name limits the watch to pods on this node (important for DaemonSets)
#
# Run:  ./otelcol --config doc/processors/k8s_attributes.example.yaml
# Env:  ELASTICSEARCH_ENDPOINT, ELASTICSEARCH_API_KEY, K8S_NODE_NAME

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  k8s_attributes:
    auth_type: serviceAccount
    passthrough: false
    filter:
      node_from_env_var: K8S_NODE_NAME
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.node.name
        - k8s.container.name
        - container.image.name
        - container.image.tag
      labels:
        - tag_name: app
          key: app.kubernetes.io/name
          from: pod
        - tag_name: team
          key: team
          from: namespace
      annotations:
        - tag_name: owner
          key: example.com/owner
          from: pod
    # How to match incoming data to a pod: SDK-provided IP/UID first, then the connection IP.
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: connection

  batch: {}

exporters:
  elasticsearch:
    endpoint: ${env:ELASTICSEARCH_ENDPOINT}
    api_key: ${env:ELASTICSEARCH_API_KEY}
    mapping:
      mode: otel

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8s_attributes, batch]
      exporters: [elasticsearch]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, k8s_attributes, batch]
      exporters: [elasticsearch]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, k8s_attributes, batch]
      exporters: [elasticsearch]
