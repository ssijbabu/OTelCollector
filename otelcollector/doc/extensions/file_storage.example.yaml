# file_storage extension — persistent key/value storage on local disk, used by other
# components to survive restarts.
#
# Scenario: node agent tailing pod logs and sending to Elasticsearch. Two things must
# survive a pod restart:
#   1. file_log read offsets  -> no duplicates and no gaps after restart
#   2. the exporter's queue   -> data waiting for a slow/unavailable Elasticsearch is not lost
#
# Kubernetes: mount a hostPath (or PVC) at /var/lib/otelcol/storage so state outlives the pod.
#
# Run:  ./otelcol --config doc/extensions/file_storage.example.yaml
# Env:  ELASTICSEARCH_ENDPOINT, ELASTICSEARCH_API_KEY

extensions:
  file_storage:
    directory: /var/lib/otelcol/storage
    create_directory: true
    timeout: 5s
    compaction:
      on_start: true
      on_rebound: true
      directory: /var/lib/otelcol/storage

receivers:
  file_log:
    include: [/var/log/pods/*/*/*.log]
    start_at: end
    storage: file_storage          # remember read offsets
    operators:
      - type: container

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

exporters:
  elasticsearch:
    endpoint: ${env:ELASTICSEARCH_ENDPOINT}
    api_key: ${env:ELASTICSEARCH_API_KEY}
    mapping:
      mode: otel
    sending_queue:
      enabled: true
      storage: file_storage        # persistent queue on disk
      queue_size: 10000
    retry:
      enabled: true
      max_retries: 10

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [file_log]
      processors: [memory_limiter]
      exporters: [elasticsearch]
