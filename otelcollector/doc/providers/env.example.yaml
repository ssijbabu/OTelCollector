# env provider — resolves ${env:NAME} references from environment variables.
#
# Scenario: one config file used in every environment (dev/test/prod) and every cluster.
# Everything that differs — endpoints, credentials, cluster names, sizes — comes from
# environment variables set by the Deployment (ConfigMap/Secret via envFrom/valueFrom).
#
# Syntax:
#   ${env:NAME}             value of NAME (empty string if unset)
#   ${env:NAME:-default}    value of NAME, or "default" if NAME is unset or empty
#   $${env:NAME}            escaped: the literal text ${env:NAME} is kept
#
# The provider can also supply the WHOLE config from one variable:
#   OTEL_CONFIG="$(cat config.yaml)" ./otelcol --config env:OTEL_CONFIG
#
# Run:  ./otelcol --config doc/providers/env.example.yaml
# Env:  ELASTICSEARCH_ENDPOINT, ELASTICSEARCH_API_KEY (required)
#       OTLP_GRPC_PORT, OTLP_HTTP_PORT, MEMORY_LIMIT_PERCENTAGE, K8S_CLUSTER_NAME,
#       DEPLOYMENT_ENVIRONMENT, BATCH_SIZE, OTEL_LOG_LEVEL (optional, have defaults)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:${env:OTLP_GRPC_PORT:-4317}
      http:
        endpoint: 0.0.0.0:${env:OTLP_HTTP_PORT:-4318}

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: ${env:MEMORY_LIMIT_PERCENTAGE:-80}
    spike_limit_percentage: 20

  resource:
    attributes:
      - key: k8s.cluster.name
        value: ${env:K8S_CLUSTER_NAME:-unknown}
        action: upsert
      - key: deployment.environment.name
        value: ${env:DEPLOYMENT_ENVIRONMENT:-development}
        action: insert

  batch:
    send_batch_size: ${env:BATCH_SIZE:-8192}
    timeout: 5s

exporters:
  elasticsearch:
    endpoint: ${env:ELASTICSEARCH_ENDPOINT}
    api_key: ${env:ELASTICSEARCH_API_KEY}
    mapping:
      mode: otel

service:
  telemetry:
    logs:
      level: ${env:OTEL_LOG_LEVEL:-info}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [elasticsearch]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [elasticsearch]
