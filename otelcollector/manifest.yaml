# OCB builder manifest — Elastic Distribution of OpenTelemetry (EDOT) Collector
# https://www.elastic.co/docs/reference/edot-collector/custom-collector
#
# Azure Event Hubs (Kafka) → Elasticsearch / OpenSearch build. Same layout and ordering as
# manifest-old.yaml so the two can be diffed directly; this file adds the OpenSearch exporter,
# the elasticmetadata processor and the beats_encoding extension, and leaves out components
# unrelated to Kafka, Elastic or Kubernetes.
#
# Event Hubs notes:
#   - azure_auth.scopes is required for Kafka: ["https://<ns>.servicebus.windows.net/.default"]
#   - Each gateway replica in the same consumer group gets a share of the partitions.
#
# Compatible with OTel Collector v1.70.0/v0.164.0 / contrib v0.164.1 / EDOT components v0.78–v0.79.
#
# Install OCB:   make install-ocb
# Regenerate:    make generate

dist:
  name: otelcol
  description: OpenTelemetry Collector — Azure Event Hubs (Kafka) to Elasticsearch
  version: 0.1.0
  output_path: .
  otelcol_version: 0.164.0

receivers:
  - gomod: github.com/elastic/opentelemetry-collector-components/receiver/elasticapmintakereceiver v0.78.0
  # - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/elasticsearchreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/k8sclusterreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/k8seventsreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/k8sobjectsreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kafkametricsreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kafkareceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kubeletstatsreceiver v0.164.1
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/receivercreator v0.164.1
  # aks — custom receiver in this repo: AKS cluster and node pool state from Azure Resource Manager
  - gomod: github.com/ssijbabu/OTelCollector/custom-components/receiver/aksclusterreceiver v0.0.0
  # azure_activity_log — custom receiver in this repo: subscription activity log from Azure Resource Manager
  - gomod: github.com/ssijbabu/OTelCollector/custom-components/receiver/azureactivitylogreceiver v0.0.0

processors:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.164.1
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/cumulativetodeltaprocessor v0.164.1
  - gomod: github.com/elastic/opentelemetry-collector-components/processor/elasticapmprocessor v0.78.0
  - gomod: github.com/elastic/opentelemetry-collector-components/processor/elasticinframetricsprocessor v0.78.0
  - gomod: github.com/elastic/opentelemetry-collector-components/processor/elasticmetadataprocessor v0.78.0
  - gomod: github.com/elastic/opentelemetry-collector-components/processor/elastictraceprocessor v0.78.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/geoipprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/k8sattributesprocessor v1.3.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/logdedupprocessor v0.164.1
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0
  - gomod: github.com/elastic/opentelemetry-collector-components/processor/ratelimitprocessor v0.78.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/tailsamplingprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.164.1

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/elasticsearchexporter v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/kafkaexporter v0.164.1
  # opensearch — write logs and traces to OpenSearch (alpha; metrics in development)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/opensearchexporter v0.164.1
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.164.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.164.0

connectors:
  - gomod: github.com/elastic/opentelemetry-collector-components/connector/elasticapmconnector v0.79.0
  - gomod: go.opentelemetry.io/collector/connector/forwardconnector v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/otlpjsonconnector v0.164.1
  - gomod: github.com/elastic/opentelemetry-collector-components/connector/profilingmetricsconnector v0.78.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/routingconnector v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/spanmetricsconnector v0.164.1

extensions:
  - gomod: github.com/elastic/opentelemetry-collector-components/extension/apikeyauthextension v0.79.0
  - gomod: github.com/elastic/opentelemetry-collector-components/extension/apmconfigextension v0.78.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/azureauthextension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/encoding/azureencodingextension v0.164.1
  - gomod: github.com/elastic/opentelemetry-collector-components/extension/beatsencodingextension v0.78.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/cgroupruntimeextension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/headerssetterextension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckv2extension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/k8sleaderelector v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/observer/k8sobserver v0.164.1
  - gomod: go.opentelemetry.io/collector/extension/memorylimiterextension v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/opampextension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.164.1

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.70.0

replaces:
  # OCB resolves these EDOT transitive deps to stale versions (elasticattr v0.40.0,
  # lsmintervalprocessor v0.62.0) that don't compile against collector v0.164 —
  # missing elasticattr.MetadataDynamicResourceAttributes and ottldatapoint.NewTransformContextPtr.
  # Pin them to the release built for the same collector version as the other EDOT components.
  - github.com/elastic/opentelemetry-collector-components/internal/elasticattr => github.com/elastic/opentelemetry-collector-components/internal/elasticattr v0.78.0
  - github.com/elastic/opentelemetry-collector-components/processor/lsmintervalprocessor => github.com/elastic/opentelemetry-collector-components/processor/lsmintervalprocessor v0.80.0
  # Custom components built from this repo (custom-components/ at the repo root)
  - github.com/ssijbabu/OTelCollector/custom-components/receiver/aksclusterreceiver => ../custom-components/receiver/aksclusterreceiver
  - github.com/ssijbabu/OTelCollector/custom-components/receiver/azureactivitylogreceiver => ../custom-components/receiver/azureactivitylogreceiver
