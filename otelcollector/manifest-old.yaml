replaces:
  # OCB resolves these EDOT transitive deps to stale versions (elasticattr v0.40.0,
  # lsmintervalprocessor v0.62.0) that don't compile against collector v0.164 —
  # missing elasticattr.MetadataDynamicResourceAttributes and ottldatapoint.NewTransformContextPtr.
  # Pin them to the release built for the same collector version as the other EDOT components.
  - github.com/elastic/opentelemetry-collector-components/internal/elasticattr => github.com/elastic/opentelemetry-collector-components/internal/elasticattr v0.78.0
  - github.com/elastic/opentelemetry-collector-components/processor/lsmintervalprocessor => github.com/elastic/opentelemetry-collector-components/processor/lsmintervalprocessor v0.80.0
