# Default runtime configuration — baked into the Docker image at /etc/otelcol/config.yaml.
#
# Receives OTLP on 4317 (gRPC) / 4318 (HTTP) and prints everything to stdout.
# To ship to Elasticsearch, set ELASTICSEARCH_ENDPOINT and ELASTICSEARCH_API_KEY,
# uncomment the elasticsearch exporter below, and add it to each pipeline.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Enrich signals with host metadata (does not override values the SDK already set).
  resource_detection:
    detectors: [env, system]
    timeout: 10s
    override: false

  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  debug:
    verbosity: basic

  # elasticsearch:
  #   endpoint: ${env:ELASTICSEARCH_ENDPOINT}
  #   api_key: ${env:ELASTICSEARCH_API_KEY}
  #   mapping:
  #     mode: otel

service:
  extensions: [health_check]

  telemetry:
    logs:
      level: info

  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [debug]
