apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-ingress
  namespace: otel-collector
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes:
  - Ingress
  ingress:
  # OTLP gRPC and HTTP from any pod in the cluster.
  # Restrict podSelector / namespaceSelector here if you want
  # to limit which workloads can send telemetry to the collector.
  - ports:
    - port: 4317
      protocol: TCP
    - port: 4318
      protocol: TCP

  # Health check probes from the kubelet (runs on the node host network,
  # not inside a pod). Replace <NODE_SUBNET_CIDR> with your node subnet,
  # e.g. 10.224.0.0/16 for AKS default node subnet.
  # With Cilium you can use CiliumNetworkPolicy fromEntities: [host] instead.
  - from:
    - ipBlock:
        cidr: <NODE_SUBNET_CIDR>
    ports:
    - port: 13133
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-egress-dns
  namespace: otel-collector
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes:
  - Egress
  egress:
  # DNS resolution via kube-dns.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-egress-gateway
  namespace: otel-collector
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes:
  - Egress
  egress:
  # OTLP gRPC to the gateway pods.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: otel-gateway
      podSelector:
        matchLabels:
          app: otel-gateway
    ports:
    - port: 4317
      protocol: TCP
