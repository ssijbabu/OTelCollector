apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel-collector
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 4
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100

      # Stamp cluster identity onto every signal as resource attributes.
      # Values come from the otel-collector-env ConfigMap via env vars in the DaemonSet.
      resource/cluster:
        attributes:
        - key: k8s.cluster.name
          value: ${env:K8S_CLUSTER_NAME}
          action: upsert
        - key: k8s.node.name
          value: ${env:K8S_NODE_NAME}
          action: upsert
        - key: cloud.provider
          value: ${env:CLOUD_PROVIDER}
          action: upsert
        - key: cloud.platform
          value: ${env:CLOUD_PLATFORM}
          action: upsert
        - key: cloud.region
          value: ${env:CLOUD_REGION}
          action: upsert
        - key: deployment.environment.name
          value: ${env:DEPLOYMENT_ENVIRONMENT}
          action: upsert

      resource_detection:
        detectors: [env, system]
        timeout: 10s
        override: false

      batch:
        send_batch_size: 1024
        send_batch_max_size: 2048
        timeout: 5s

    exporters:
      # Forward everything to the gateway Deployment over OTLP gRPC.
      # The sending queue buffers data in memory while the gateway is unavailable.
      otlp_grpc/gateway:
        endpoint: otel-gateway.otel-gateway.svc.cluster.local:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 60s
          max_elapsed_time: 10m
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000

    service:
      extensions: [health_check]

      telemetry:
        logs:
          level: info

      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster, resource_detection, batch]
          exporters: [otlp_grpc/gateway]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster, resource_detection, batch]
          exporters: [otlp_grpc/gateway]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster, resource_detection, batch]
          exporters: [otlp_grpc/gateway]
