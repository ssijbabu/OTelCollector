apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: otel-gateway
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      # OTLP from the otel-collector DaemonSet (and any workload that sends directly).
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 800
        spike_limit_mib: 200

      # Re-stamp cluster identity in case upstream signals are missing it.
      # Uses insert so attributes already set by the collector are not overwritten.
      resource/cluster:
        attributes:
        - key: k8s.cluster.name
          value: ${env:K8S_CLUSTER_NAME}
          action: insert
        - key: cloud.provider
          value: ${env:CLOUD_PROVIDER}
          action: insert
        - key: cloud.platform
          value: ${env:CLOUD_PLATFORM}
          action: insert
        - key: cloud.region
          value: ${env:CLOUD_REGION}
          action: insert
        - key: deployment.environment.name
          value: ${env:DEPLOYMENT_ENVIRONMENT}
          action: insert

      batch:
        send_batch_size: 1024
        send_batch_max_size: 2048
        timeout: 5s

      # Derives APM transaction/span metadata so traces render in Kibana's APM UI.
      elasticapm: {}

    connectors:
      # Produces the aggregated APM metrics (latency, throughput, error rate) used by Kibana APM.
      elasticapm: {}

    exporters:
      elasticsearch:
        endpoint: ${env:ELASTICSEARCH_ENDPOINT}
        api_key: ${env:ELASTICSEARCH_API_KEY}
        mapping:
          mode: otel
        retry:
          enabled: true
          max_retries: 5
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000

    service:
      extensions: [health_check]

      telemetry:
        logs:
          level: info

      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster, elasticapm, batch]
          exporters: [elasticapm, elasticsearch]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster, batch]
          exporters: [elasticsearch]
        metrics/aggregated-otel-metrics:
          receivers: [elasticapm]
          processors: []
          exporters: [elasticsearch]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster, elasticapm, batch]
          exporters: [elasticapm, elasticsearch]
