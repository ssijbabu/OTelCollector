# Elasticsearch connection for the gateway's elasticsearch exporter.
# Prefer creating this out-of-band rather than committing real values:
#   kubectl create secret generic otel-gateway-elasticsearch -n otel-gateway \
#     --from-literal=endpoint=https://<deployment>.es.<region>.azure.elastic-cloud.com:443 \
#     --from-literal=api-key=<base64-api-key>
apiVersion: v1
kind: Secret
metadata:
  name: otel-gateway-elasticsearch
  namespace: otel-gateway
type: Opaque
stringData:
  endpoint: <ELASTICSEARCH_ENDPOINT>
  api-key: <ELASTICSEARCH_API_KEY>
