# Local binary example — OTLP in, Elasticsearch + debug out.
#
# Ports are offset from the defaults (14317, 14318, 13134) so this can run next to
# a port-forwarded in-cluster collector.
#
# Required env vars:
#   ELASTICSEARCH_ENDPOINT  e.g. https://my-deployment.es.westeurope.azure.elastic-cloud.com:443
#   ELASTICSEARCH_API_KEY   base64-encoded Elasticsearch API key

extensions:
  health_check:
    endpoint: 0.0.0.0:13134

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14317
      http:
        endpoint: 0.0.0.0:14318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  resource_detection:
    detectors: [env, system]
    timeout: 10s
    override: false

  batch:
    send_batch_size: 512
    timeout: 5s

  # Derives APM transaction/span metadata so traces render in Kibana's APM UI.
  elasticapm: {}

connectors:
  # Produces the aggregated APM metrics (latency, throughput, error rate) used by Kibana APM.
  elasticapm: {}

exporters:
  debug:
    verbosity: normal

  elasticsearch:
    endpoint: ${env:ELASTICSEARCH_ENDPOINT}
    api_key: ${env:ELASTICSEARCH_API_KEY}
    mapping:
      mode: otel
    retry:
      enabled: true
      max_retries: 5

service:
  extensions: [health_check]

  telemetry:
    logs:
      level: info

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, elasticapm, batch]
      exporters: [elasticapm, elasticsearch, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [elasticsearch, debug]
    metrics/aggregated-otel-metrics:
      receivers: [elasticapm]
      processors: []
      exporters: [elasticsearch]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, elasticapm, batch]
      exporters: [elasticapm, elasticsearch, debug]
